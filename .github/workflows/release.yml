# Publish the sam3rs command as a GitHub release when a version tag is pushed
#
#   add a CHANGELOG.md entry for the version, then
#   git tag v0.1.1
#   git push origin v0.1.1
#
# The Package workflow publishes the crate and the Python package from the same tag.
#
# Asset names match install.sh:
#   sam3rs-<tag>-x86_64-unknown-linux-gnu.tar.gz
#
# The binary opens libcuda and cuBLAS with dlopen, which a static musl build can't do,
# so Linux ships as glibc. cargo-zigbuild links against glibc 2.28, the same floor as
# the manylinux_2_28 Python wheel, instead of the runner's newer glibc. There is no
# macOS or Windows build, since there is no CPU or Metal backend.
#
# Pull requests that touch the release files build and check the archive without
# uploading it.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release.yml
      - install.sh

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings
  # the kernels ship as PTX and CUDA loads at run time, so nothing here needs a toolkit
  CUDA_HOME: /nonexistent
  # the crate's release profile keeps line tables for profiling; the shipped binary
  # drops them, which takes it from 60 MB to 11 MB
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the crate matches the tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "sam3rs") | .version')"
          test "v$version" = "$GITHUB_REF_NAME"

      # stays a draft until every asset uploads, so install.sh never resolves a latest
      # release that is missing its archive
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          draft: true
          # the tag's CHANGELOG.md entry becomes the release notes; a tag without one fails
          changelog: CHANGELOG.md

  upload-assets:
    needs: create-release
    # runs on pull requests too, where create-release is skipped
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          # a release build never restores objects a pull request may have cached
          use-cache: false

      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: sam3rs
          package: sam3rs
          features: cli
          target: x86_64-unknown-linux-gnu.2.28
          build-tool: cargo-zigbuild
          archive: $bin-$tag-$target
          tar: unix
          checksum: sha256
          locked: true
          dry-run: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          dry-run-intended: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      # the archive must run on the oldest glibc install.sh promises, so fail on any
      # symbol versioned above 2.28
      - name: Check glibc floor and the binary runs
        shell: bash
        env:
          ARCHIVE: ${{ steps.upload.outputs.tar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/archive"
          bin="$RUNNER_TEMP/archive/sam3rs"
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "newest glibc symbol: $newest"
          test "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -n 1)" = 2.28
          "$bin" --help

  upload-install-script:
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" install.sh --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [upload-assets, upload-install-script]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
