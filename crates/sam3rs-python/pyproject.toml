[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sam3rs"
dynamic = ["version"]
description = "SAM 3 image segmentation on NVIDIA GPUs with text, box and point prompts, in native Rust/CUDA"
readme = "README.md"
requires-python = ">=3.11"
# TODO(license): keep in step with the workspace license; see the root Cargo.toml
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Praveen Perera" }]
keywords = ["sam3", "segment-anything", "segmentation", "cuda", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# cuBLAS 13 for the GEMMs; the NVIDIA driver supplies everything else
cuda = ["nvidia-cublas>=13,<14; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
sam3rs = "sam3rs.cli:main"

[project.urls]
Repository = "https://github.com/avencera/sam3rs"
Documentation = "https://github.com/avencera/sam3rs/blob/master/crates/sam3rs-python/README.md"

[dependency-groups]
test = ["pytest>=8"]

[tool.maturin]
module-name = "sam3rs._native"
python-source = "python"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# release builds keep line tables for profiling; the wheel needs none of them
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an NVIDIA GPU, cuBLAS 13 and the weights in models/sam3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["sam3rs", "conftest"]
