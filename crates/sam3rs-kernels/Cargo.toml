[package]
name = "sam3rs-kernels"
version = "0.0.0"
edition = "2024"
publish = false
description = "cuda-oxide device kernels for sam3rs, compiled offline to the PTX the sam3rs crate embeds"
license = "Apache-2.0"

# standalone: cuda-oxide needs its pinned toolchain with rustc-dev and Linux with CUDA, so
# this crate stays out of the sam3rs workspace and only scripts/build-ptx.sh builds it
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
# cuda-oxide from NVIDIA/cuda-rust main, pinned to a commit rather than a branch so the
# codegen can't drift under an unchanged manifest. Move the pin in its own change: rebuild
# the PTX at both commits and compare every kernel's SASS and timing (gpu-work skill).
# Cargo.lock pins the commit and scripts/build-ptx.sh installs the cargo-oxide of that same
# commit, so the device API and the codegen backend match
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust.git", rev = "8d825486993f806903d8968232214ddafa8ed7da" }
