[workspace]
members = ["crates/sam3rs-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
# TODO(license): Apache-2.0 is a placeholder until the license is chosen. To switch to
# Meta's SAM License, which has no SPDX id: put its text in LICENSE, replace this line
# with `license-file = "LICENSE"`, set `license = "LicenseRef-SAM-License"` in
# crates/sam3rs-python/pyproject.toml, and drop NOTICE from the repo, `include` and
# `license-files`
license = "Apache-2.0"
repository = "https://github.com/avencera/sam3rs"
authors = ["Praveen Perera"]

# house style beyond clippy's defaults: named imports and no redundant closures. CI denies
# warnings, so these fail the build
[workspace.lints.clippy]
enum_glob_use = "warn"
wildcard_imports = "warn"
redundant_closure_for_method_calls = "warn"

[package]
name = "sam3rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Rust/CUDA runtime for Meta SAM 3 image segmentation with text, box and point prompts"
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/sam3rs"
readme = "README.md"
keywords = ["sam3", "segmentation", "cuda", "vision", "inference"]
categories = ["computer-vision", "science"]
include = [
    "/src/**",
    "/kernels/**",
    "/csrc/**",
    "/examples/**",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/Cargo.toml",
    # the tokenizer unit test compares against these upstream cases
    "/tests/tokenizer_cases.json",
]

[lints]
workspace = true

[features]
default = ["online"]
# blocking Hub downloads through hf-fetch, with rustls and no async runtime
online = ["dep:hf-fetch", "hf-fetch/online"]
# the `sam3rs` command
cli = ["dep:clap", "dep:color-eyre"]
# NVTX ranges per pipeline stage for nsys; builds csrc/nvtx.c against the CUDA toolkit's
# headers, so it is the one feature that needs a toolkit at build time
nvtx = ["dep:cc"]

[dependencies]
# libcuda and cuBLAS are loaded at run time and the kernels ship as PTX, so the crate
# builds without a CUDA toolkit. The 13.0 API floor matches the PTX ISA (driver r580+)
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "cublaslt",
    "dynamic-loading",
    "cuda-13000",
] }
bytemuck = "1"
safetensors = "0.8.0"
memmap2 = "0.9.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
regex = "1.13"
eyre = "0.6"
hf-fetch = { version = "0.1.2", default-features = false, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
color-eyre = { version = "0.6", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
tempfile = "3"

[[bin]]
name = "sam3rs"
required-features = ["cli"]

[profile.release]
debug = "line-tables-only"
