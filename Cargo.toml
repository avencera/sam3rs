[workspace]
members = ["crates/sam3rs-python"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
# sam3rs is an independent implementation, so its code takes its own license; the SAM 3
# weights it loads stay under Meta's SAM License, which NOTICE points users to
license = "Apache-2.0"
repository = "https://github.com/avencera/sam3rs"
authors = ["Praveen Perera"]

# house style beyond clippy's defaults: named imports and no redundant closures. CI denies
# warnings, so these fail the build
[workspace.lints.clippy]
enum_glob_use = "warn"
wildcard_imports = "warn"
redundant_closure_for_method_calls = "warn"

[package]
name = "sam3rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Real-time Meta SAM 3 in native Rust on NVIDIA GPUs (CUDA) and Apple silicon (Metal): text, box and click segmentation and video tracking, up to 93x faster than PyTorch"
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/sam3rs"
readme = "README.md"
keywords = ["sam3", "segmentation", "cuda", "metal", "inference"]
categories = ["computer-vision", "science"]
include = [
    "/src/**",
    "/kernels/**",
    "/csrc/**",
    "/examples/**",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/Cargo.toml",
    # the tokenizer unit test compares against these upstream cases
    "/tests/tokenizer_cases.json",
]

[lints]
workspace = true

[features]
default = ["online"]
# blocking Hub downloads through hf-fetch, with rustls and no async runtime
online = ["dep:hf-fetch", "hf-fetch/online"]
# the `sam3rs` command
cli = ["dep:clap", "dep:color-eyre"]
# NVTX ranges per pipeline stage for nsys; builds csrc/nvtx.c against the CUDA toolkit's
# headers, so it is the one feature that needs a toolkit at build time
nvtx = ["dep:cc"]

[dependencies]
bytemuck = "1"
safetensors = "0.8.0"
memmap2 = "0.9.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
regex = "1.13"
eyre = "0.6"
hf-fetch = { version = "0.1.2", default-features = false, optional = true }
clap = { version = "4", features = ["derive"], optional = true }
color-eyre = { version = "0.6", optional = true }

# the CUDA backend, built everywhere but macOS
[target.'cfg(not(target_os = "macos"))'.dependencies]
# libcuda and cuBLAS are loaded at run time and the kernels ship as PTX, so the crate
# builds without a CUDA toolkit. The 13.0 API floor is cuBLAS 13's (driver r580+).
# cuBLAS takes only its types from cudarc; src/cuda/cublas.rs opens it by soname instead
cudarc = { version = "0.19.10", default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "cublaslt",
    "dynamic-loading",
    "cuda-13000",
] }
# opens cuBLAS by soname; cudarc depends on the same version
libloading = "0.9"

# the Metal backend on macOS. Kernels are MSL source the OS compiles when a model loads,
# so building needs no Xcode or Metal toolchain
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSDictionary",
    # the macOS version check before any Metal 4 call
    "NSProcessInfo",
    # counter sample buffers for SAM3RS_METAL_PROFILE
    "NSArray",
    "NSData",
    "NSRange",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "MTLAllocation",
    "MTLArgument",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePass",
    "MTLComputePipeline",
    "MTLCounters",
    "MTLDataType",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }
half = "2"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
tempfile = "3"

[[bin]]
name = "sam3rs"
required-features = ["cli"]

[profile.release]
debug = "line-tables-only"
